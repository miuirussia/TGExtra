name: Build and Release Tweak

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - '**'

concurrency:
  group: release-${{ inputs.tag || (github.ref == 'refs/heads/main' && 'prerelease') || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref == 'refs/heads/main' && 'prerelease') || github.ref_name }}
  BUILD_REF: ${{ inputs.tag || github.sha }}

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Protocol, patch packaging and release checks
        run: bash Tests/run.sh

  build:
    needs: checks
    runs-on: macos-26
    strategy:
      matrix:
        scheme: [rootful, rootless, roothide]
        include:
          - scheme: rootful
            scheme_arg: ""
          - scheme: rootless
            scheme_arg: "THEOS_PACKAGE_SCHEME=rootless"
          - scheme: roothide
            scheme_arg: "THEOS_PACKAGE_SCHEME=roothide"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Install Theos dependencies
        shell: bash
        run: |
          brew install make ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      # Check out the selected branches directly; the cached updater expects origin/master.
      - name: Set up Theos
        uses: actions/checkout@v7
        with:
          repository: waruhachi/theos
          ref: main
          submodules: recursive
          path: theos

      - name: Set up iOS SDKs
        uses: actions/checkout@v7
        with:
          repository: waruhachi/sdks
          ref: main
          submodules: recursive
          path: theos/sdks

      - name: Build Package
        shell: bash
        run: |
          make clean package FINALPACKAGE=1 ${{ matrix.scheme_arg }}

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scheme }}-package
          path: packages/*.deb

  cyan:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Generate cyan package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
      
          TWEAK="$(find ./packages -type f -name 'com.choco.tg_*_iphoneos-arm.deb' | head -n 1)"
          test -n "$TWEAK"
      
          TGEXTRA_VERSION="$(basename "$TWEAK" | sed -E 's/com\.choco\.tg_([0-9.]+)_.+\.deb/\1/')"
          mkdir -p ./packages
          
          python3 -m venv "$RUNNER_TEMP/cyan-tools"
          "$RUNNER_TEMP/cyan-tools/bin/pip" install https://github.com/iOSDecrypted/pyzule-rw/archive/main.zip
          "$RUNNER_TEMP/cyan-tools/bin/cgen" \
            -o "$RUNNER_TEMP/base.cyan" \
            -dqg \
            -f "$TWEAK"
          python3 Tools/package_cyan.py \
            --base "$RUNNER_TEMP/base.cyan" --patches Patches \
            --output "./packages/com.choco.tg_${TGEXTRA_VERSION}.cyan"

      - name: Upload cyan
        uses: actions/upload-artifact@v7
        with:
          name: cyan-package
          path: packages/*.cyan

  release:
    needs: cyan
    runs-on: macos-26
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Generate Checksums
        id: metadata
        shell: bash
        run: |
          for pkg in packages/*_iphoneos-arm.deb; do
            if [ -f "$pkg" ]; then
              echo "### Rootful (iphoneos-arm)" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for pkg in packages/*_iphoneos-arm64.deb; do
            if [ -f "$pkg" ]; then
              echo "### Rootless (iphoneos-arm64)" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for pkg in packages/*_iphoneos-arm64e.deb; do
            if [ -f "$pkg" ]; then
              echo "### RootHide (iphoneos-arm64e)" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for pkg in packages/*.cyan; do
            if [ -f "$pkg" ]; then
              echo "### Cyan Package" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

      - name: Update prerelease tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push --force origin "$GITHUB_SHA:refs/tags/prerelease"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.BUILD_REF }}
          name: ${{ github.event.repository.name }} ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          files: |
            packages/*.deb
            packages/*.cyan
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ env.RELEASE_TAG == 'prerelease' }}
          make_latest: ${{ env.RELEASE_TAG != 'prerelease' }}

      - name: Delete outdated release packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name | select(endswith(".deb") or endswith(".cyan"))' > release_assets.txt

          while IFS= read -r asset; do
            if [ ! -f "packages/$asset" ]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < release_assets.txt

      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            rootful-package
            rootless-package
            roothide-package
            cyan-package
          failOnError: false
