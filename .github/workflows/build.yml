name: Build and Release Tweak

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true
        type: string
  push:
    branches:
      - main
    tags:
      - '**'

concurrency:
  group: release-${{ inputs.tag || (github.ref == 'refs/heads/main' && 'prerelease') || github.ref_name }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ inputs.tag || (github.ref == 'refs/heads/main' && 'prerelease') || github.ref_name }}
  BUILD_REF: ${{ inputs.tag || github.sha }}

jobs:
  checks:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}
      - name: Compile patch payloads from C
        run: python3 Tools/build_payloads.py
      - name: Protocol, patch packaging and release checks
        run: bash Tests/run.sh

      - name: Upload tested patch profiles
        uses: actions/upload-artifact@v7
        with:
          name: compiled-payloads
          path: Patches/
          if-no-files-found: error

  build:
    needs: checks
    runs-on: macos-26-intel
    strategy:
      max-parallel: 3
      matrix:
        include:
          - scheme: rootful
            scheme_arg: ""
          - scheme: rootless
            scheme_arg: rootless
          - scheme: roothide
            scheme_arg: roothide
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: ${{ matrix.scheme_arg }}
      CCACHE_DIR: ${{ github.workspace }}/.build/ccache
      CCACHE_MAXSIZE: 500M
      # Theos enables Clang modules; ccache requires depend mode for them.
      CCACHE_DEPEND: "true"
      CCACHE_SLOPPINESS: modules
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.build/clang-module-cache
      SWIFT_MODULECACHE_PATH: ${{ github.workspace }}/.build/swift-module-cache
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Install Theos dependencies
        shell: bash
        run: |
          brew install make ldid ccache
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Resolve dependency and toolchain versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          theos_sha=$(git ls-remote --exit-code https://github.com/waruhachi/theos.git refs/heads/main | awk '{print $1}')
          sdks_sha=$(git ls-remote --exit-code https://github.com/waruhachi/sdks.git refs/heads/main | awk '{print $1}')
          echo "theos=$theos_sha" >> "$GITHUB_OUTPUT"
          echo "sdks=$sdks_sha" >> "$GITHUB_OUTPUT"
          toolchain=$({ sw_vers -buildVersion; xcodebuild -version; xcrun swiftc --version; ccache --version; } | shasum -a 256 | awk '{print $1}')
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Cache Theos and iOS SDKs
        id: theos-cache
        uses: actions/cache@v5
        with:
          path: theos
          key: ${{ runner.os }}-${{ runner.arch }}-theos-v1-${{ steps.versions.outputs.toolchain }}-${{ steps.versions.outputs.theos }}-${{ steps.versions.outputs.sdks }}

      - name: Set up Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: waruhachi/theos
          ref: ${{ steps.versions.outputs.theos }}
          submodules: recursive
          path: theos
          persist-credentials: false

      - name: Set up iOS SDKs
        if: steps.theos-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: waruhachi/sdks
          ref: ${{ steps.versions.outputs.sdks }}
          submodules: recursive
          path: theos/sdks
          persist-credentials: false

      - name: Cache compiler outputs and modules
        uses: actions/cache@v5
        with:
          path: |
            .build/ccache
            .build/clang-module-cache
            .build/swift-module-cache
          key: ${{ runner.os }}-${{ runner.arch }}-compiler-v1-${{ matrix.scheme }}-${{ steps.versions.outputs.toolchain }}-${{ steps.versions.outputs.theos }}-${{ steps.versions.outputs.sdks }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-compiler-v1-${{ matrix.scheme }}-${{ steps.versions.outputs.toolchain }}-${{ steps.versions.outputs.theos }}-${{ steps.versions.outputs.sdks }}-

      - name: Build ${{ matrix.scheme }} package
        shell: bash
        run: |
          set -euo pipefail
          ccache --zero-stats
          make clean package FINALPACKAGE=1 "THEOS_PACKAGE_SCHEME=$THEOS_PACKAGE_SCHEME" \
            "TARGET_CC=ccache $(xcrun --sdk iphoneos -f clang)" \
            "TARGET_CXX=ccache $(xcrun --sdk iphoneos -f clang++)" \
            "ADDITIONAL_SWIFTFLAGS=-module-cache-path $SWIFT_MODULECACHE_PATH"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload DEBs
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scheme }}-package
          path: packages/*.deb
          if-no-files-found: error

  ipatch:
    needs: [checks, build]
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: '*-package'
          path: packages
          merge-multiple: true

      - name: Download tested patch profiles compiled from C
        uses: actions/download-artifact@v8
        with:
          name: compiled-payloads
          path: .build/compiled-patches

      - name: Generate ipatch for every DEB
        shell: bash
        run: |
          set -euo pipefail
          for deb in packages/*.deb; do
            python3 Tools/package_ipatch.py --deb "$deb" --patches .build/compiled-patches \
              --output "${deb%.deb}.ipatch"
          done

      - name: Upload ipatch packages
        uses: actions/upload-artifact@v7
        with:
          name: ipatch-packages
          path: packages/*.ipatch
          if-no-files-found: error

  release:
    needs: ipatch
    runs-on: macos-26-intel
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_REF }}

      - name: Download all packages
        uses: actions/download-artifact@v8
        with:
          pattern: '*-package*'
          path: packages
          merge-multiple: true

      - name: Generate Checksums
        id: metadata
        shell: bash
        run: |
          for pkg in packages/*_iphoneos-arm.deb; do
            if [ -f "$pkg" ]; then
              echo "### Rootful (iphoneos-arm)" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for pkg in packages/*_iphoneos-arm64.deb; do
            if [ -f "$pkg" ]; then
              echo "### Rootless (iphoneos-arm64)" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for pkg in packages/*_iphoneos-arm64e.deb; do
            if [ -f "$pkg" ]; then
              echo "### RootHide (iphoneos-arm64e)" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for pkg in packages/*.ipatch; do
            if [ -f "$pkg" ]; then
              echo "### ipatch: $(basename "$pkg")" >> release_body.md
              echo "* MD5: $(md5 -q $pkg)" >> release_body.md
              echo "* SHA1: $(shasum -a 1 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 $pkg | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
            fi
          done

      - name: Update prerelease tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push --force origin "$GITHUB_SHA:refs/tags/prerelease"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.BUILD_REF }}
          name: ${{ github.event.repository.name }} ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          files: |
            packages/*.deb
            packages/*.ipatch
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ env.RELEASE_TAG == 'prerelease' }}
          make_latest: ${{ env.RELEASE_TAG != 'prerelease' }}

      - name: Delete outdated release packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name | select(endswith(".deb") or endswith(".cyan") or endswith(".ipatch"))' > release_assets.txt

          while IFS= read -r asset; do
            if [ ! -f "packages/$asset" ]; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done < release_assets.txt

      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            rootful-package
            rootless-package
            roothide-package
            ipatch-packages
            compiled-payloads
          failOnError: false
