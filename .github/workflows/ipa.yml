name: Build and Release IPA

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      decrypted_ipa_url:
        description: "Direct URL of the decrypted IPA"
        required: true
        type: string
      release_tag:
        description: "Release tag (empty selects the latest stable release)"
        required: false
        type: string

concurrency:
  group: ipa-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepareDependencies:
    name: Prepare Dependencies
    runs-on: macos-26
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      build_ref: ${{ steps.release.outputs.ref }}
      ipa_app_name: ${{ steps.extractIPA.outputs.ipa_app_name }}
      ipa_bundle_id: ${{ steps.extractIPA.outputs.ipa_bundle_id }}
      ipa_version: ${{ steps.extractIPA.outputs.ipa_version }}
      tgextra_version: ${{ steps.extractTGExtra.outputs.tgextra_version }}
    steps:
      - name: Resolve published TGExtra release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TAG" ]; then
            TAG=$(gh release view "$REQUESTED_TAG" --json tagName --jq .tagName)
          else
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch TGExtra.bundle
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.ref }}

      - name: Download decrypted IPA
        env:
          IPA_URL: ${{ inputs.decrypted_ipa_url }}
        run: |
          test -n "$IPA_URL"
          curl --fail -L -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" -o decrypted.ipa "$IPA_URL"
          unzip -q decrypted.ipa

      - name: Extract Name, Bundle ID, and Version
        id: extractIPA
        run: |
          python3 - <<'PYINFO'
          import glob, os, pathlib, plistlib
          paths = glob.glob('Payload/*.app/Info.plist')
          if len(paths) != 1:
              raise ValueError('Expected one app')
          info = plistlib.loads(pathlib.Path(paths[0]).read_bytes())
          values = {'ipa_app_name': info.get('CFBundleDisplayName') or info.get('CFBundleName') or info['CFBundleExecutable'],
                    'ipa_bundle_id': info['CFBundleIdentifier'], 'ipa_version': info['CFBundleShortVersionString']}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  if not isinstance(value, str) or not value or '\n' in value or '/' in value:
                      raise ValueError('Invalid app metadata')
                  output.write(f'{key}={value}\n')
          PYINFO

      - name: Download TGExtra release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'com.choco.tg_*_iphoneos-arm.deb' --pattern '*.cyan' --dir .

      - name: Extract TGExtra version
        id: extractTGExtra
        run: |
          FIRST=$(ls com.choco.tg_*_iphoneos-arm.deb | head -n1)
          TGEXTRA_VERSION=$(echo "$FIRST" | sed -E 's/com\.choco\.tg_([0-9\.]+)_.+\.deb/\1/')

          echo "tgextra_version=$TGEXTRA_VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Dependencies
        uses: actions/upload-artifact@v7
        with:
          name: dependencies
          path: |
            decrypted.ipa
            TGExtra.bundle
            com.choco.tg_*_iphoneos-arm.deb
            com.choco.tg_*.cyan

  inject:
    name: Inject TGExtra and Rust bridge
    needs: prepareDependencies
    runs-on: macos-26
    env:
      IPA_BUNDLE_ID: ${{ needs.prepareDependencies.outputs.ipa_bundle_id }}
      IPA_VERSION: ${{ needs.prepareDependencies.outputs.ipa_version }}
      TGEXTRA_VERSION: ${{ needs.prepareDependencies.outputs.tgextra_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepareDependencies.outputs.build_ref }}

      - name: Download dependencies
        uses: actions/download-artifact@v8
        with:
          path: dependencies
          name: dependencies
          merge-multiple: true

      - name: Install insert_dylib
        run: |
          git clone https://github.com/Tyilo/insert_dylib.git
          cc insert_dylib/insert_dylib/main.c -o insert_dylib_bin
          sudo mv insert_dylib_bin /usr/local/bin/insert_dylib

      - name: Install ldid
        run: |
          brew install ldid

      - name: Inject TGExtra and patch Rust MTProto
        run: |
          set -e

          DECRYPTED_IPA="dependencies/decrypted.ipa"
          TGEXTRA_BUNDLE="dependencies/TGExtra.bundle"
          TGEXTRA_DEB="dependencies/com.choco.tg_${TGEXTRA_VERSION}_iphoneos-arm.deb"

          OUT_BASE="$IPA_BUNDLE_ID-$IPA_VERSION-TGExtra-$TGEXTRA_VERSION"
          OUT_IPA="$OUT_BASE.ipa"
          OUT_TIPA="$OUT_BASE.tipa"
          TMP_DIR="tmp-ipa"
          DYLIB_NAME="libTGExtra.dylib"

          mkdir -p deb-extract artifacts
          ar x "$TGEXTRA_DEB"
          tar -xf data.tar.* -C deb-extract

          find deb-extract -name "*.dylib"


          unzip "$DECRYPTED_IPA" -d "$TMP_DIR"
          APP_PATH=$(find "$TMP_DIR/Payload" -type d -name "*.app" | head -n 1)
          PLIST="$APP_PATH/Info.plist"
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PLIST")
          BIN_PATH="$APP_PATH/$EXECUTABLE_NAME"

          mkdir -p "$APP_PATH/Frameworks"

          DYLIB_PATH=$(find deb-extract -name "*.dylib" | head -n 1)
          cp "$DYLIB_PATH" "$APP_PATH/Frameworks/$DYLIB_NAME"

          python3 Tools/prepare_rust_patch.py "$DECRYPTED_IPA" artifacts/client-patches.cyan \
            --apply-app "$APP_PATH" --patched-paths-file rust-binaries.txt --allow-no-rust
          while IFS= read -r binary; do
            ldid -S "$binary"
          done < rust-binaries.txt

          insert_dylib --all-yes @executable_path/Frameworks/$DYLIB_NAME "$BIN_PATH"
          mv "$BIN_PATH"_patched "$BIN_PATH"

          cp -R "$TGEXTRA_BUNDLE" "$APP_PATH/"

          ldid -S "$BIN_PATH"

          otool -L "$BIN_PATH" | grep -F "$DYLIB_NAME"

          (cd "$TMP_DIR" && zip -qr "../$OUT_IPA" .)
          cp "$OUT_IPA" "artifacts/$OUT_IPA"
          cp "$OUT_IPA" "artifacts/$OUT_TIPA"

          rm -rf deb-extract "$TMP_DIR"

      - name: Upload injected IPA
        uses: actions/upload-artifact@v7
        with:
          name: injected-artifacts
          path: |
            artifacts/*.ipa
            artifacts/*.tipa
            artifacts/client-patches.cyan

  patch:
    name: Patch injected IPA
    needs: [prepareDependencies, inject]
    runs-on: macos-26
    env:
      IPA_BUNDLE_ID: ${{ needs.prepareDependencies.outputs.ipa_bundle_id }}
      IPA_VERSION: ${{ needs.prepareDependencies.outputs.ipa_version }}
      TGEXTRA_VERSION: ${{ needs.prepareDependencies.outputs.tgextra_version }}
    steps:
      - name: Download dependencies
        uses: actions/download-artifact@v8
        with:
          path: dependencies
          name: dependencies
          merge-multiple: true

      - name: Download injected IPA
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          name: injected-artifacts
          merge-multiple: true

      - name: Install ipapatch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/asdfzxcvbn/ipapatch/releases/latest --jq .tag_name)
          ARCH=$(uname -m)
          if [[ "$ARCH" == "arm64" ]]; then
            ASSET="ipapatch.macos-arm64"
          else
            ASSET="ipapatch.macos-amd64"
          fi

          gh release download "$TAG" --repo asdfzxcvbn/ipapatch --pattern "$ASSET" --dir .

          mkdir -p bin
          mv "$ASSET" bin/ipapatch
          chmod +x bin/ipapatch
          echo "PATH=$GITHUB_WORKSPACE/bin:$PATH" >> $GITHUB_ENV

      - name: Patch injected IPA
        run: |
          OUT_BASE="$IPA_BUNDLE_ID-$IPA_VERSION-TGExtra-$TGEXTRA_VERSION"
          INJECTED_IPA="artifacts/$OUT_BASE.ipa"
          INJECTED_TIPA="artifacts/$OUT_BASE.tipa"

          ipapatch --input "$INJECTED_IPA" --inplace --noconfirm
          ipapatch --input "$INJECTED_TIPA" --inplace --noconfirm

      - name: Upload injected IPA
        uses: actions/upload-artifact@v7
        with:
          name: patched-artifacts
          path: |
            artifacts/*.ipa
            artifacts/*.tipa
            artifacts/client-patches.cyan

  updateRelease:
    name: Update GitHub Release
    needs: [prepareDependencies, inject, patch]
    runs-on: macos-26
    env:
      IPA_APP_NAME: ${{ needs.prepareDependencies.outputs.ipa_app_name }}
      RELEASE_TAG: ${{ needs.prepareDependencies.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepareDependencies.outputs.build_ref }}

      - name: Download injected IPA
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          name: patched-artifacts
          merge-multiple: true

      - name: Merge this client into the universal cyan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern 'com.choco.tg_*.cyan' --dir cyan-base
          BASE=$(find cyan-base -maxdepth 1 -name '*.cyan' -print -quit)
          test -n "$BASE"
          python3 Tools/package_cyan.py --base "$BASE" --merge artifacts/client-patches.cyan \
            --output "artifacts/$(basename "$BASE")"

      - name: Fetch existing release body
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$RELEASE_TAG" --repo ${{ github.repository }} --json body --jq .body > release_body.md

      - name: Generate Checksums
        id: metadata
        run: |
          if [ -f release_body.md ]; then
            awk -v sideload="### $IPA_APP_NAME (Sideload)" -v troll="### $IPA_APP_NAME (TrollStore)" '
              BEGIN { skip=0 }
              {
                if ($0 == sideload || $0 == troll || $0 == "### Cyan Package") { skip=1 }
                if (skip && /^### / && $0 != sideload && $0 != troll && $0 != "### Cyan Package") { skip=0 }
                if (!skip) print $0
              }
            ' release_body.md > release_body.tmp && mv release_body.tmp release_body.md
          fi

          for ipa in artifacts/*.ipa; do
            if [ -f "$ipa" ]; then
              echo "### $IPA_APP_NAME (Sideload)" >> release_body.md
              echo "* MD5: $(md5 -q "$ipa")" >> release_body.md
              echo "* SHA1: $(shasum -a 1 "$ipa" | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 "$ipa" | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for tipa in artifacts/*.tipa; do
            if [ -f "$tipa" ]; then
              echo "### $IPA_APP_NAME (TrollStore)" >> release_body.md
              echo "* MD5: $(md5 -q "$tipa")" >> release_body.md
              echo "* SHA1: $(shasum -a 1 "$tipa" | awk '{ print $1 }')" >> release_body.md
              echo "* SHA256: $(shasum -a 256 "$tipa" | awk '{ print $1 }')" >> release_body.md
              echo "" >> release_body.md
              break
            fi
          done

          for cyan in artifacts/com.choco.tg_*.cyan; do
            echo "### Cyan Package" >> release_body.md
            echo "* SHA256: $(shasum -a 256 "$cyan" | awk '{ print $1 }')" >> release_body.md
          done

      - name: Update GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepareDependencies.outputs.release_tag }}
          name: ${{ github.event.repository.name }} ${{ needs.prepareDependencies.outputs.release_tag }}
          body_path: release_body.md
          files: |
            artifacts/*.ipa
            artifacts/*.tipa
            artifacts/com.choco.tg_*.cyan
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ needs.prepareDependencies.outputs.release_tag == 'prerelease' }}
          make_latest: false
  cleanup:
    name: Cleanup
    needs: updateRelease
    runs-on: macos-26
    permissions:
      actions: write
    steps:
      - name: Delete build artifacts
        uses: geekyeggo/delete-artifact@v6
        with:
          name: |
            injected-artifacts
            patched-artifacts
            dependencies
          failOnError: false
